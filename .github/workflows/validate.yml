name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned quality tools
        run: python -m pip install ruff==0.17.2
      - name: Run Ruff
        run: ruff check custom_components/dimplex_sierra_ble
      - name: Compile Python sources
        run: python -m compileall -q custom_components/dimplex_sierra_ble

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run pinned HACS validator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e INPUT_GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e GITHUB_REPOSITORY \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_SHA \
            -e GITHUB_REF \
            -e INPUT_CATEGORY=integration \
            -e INPUT_COMMENT=false \
            -e INPUT_REPOSITORY="$GITHUB_REPOSITORY" \
            -e GITHUB_WORKSPACE=/github/workspace \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run pinned hassfest validator
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            ghcr.io/home-assistant/hassfest@sha256:ac7d08c82d8b583ff7dc356faf993d08650cfc3015087cace566d65827a04c85
